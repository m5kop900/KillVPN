name: Release

# Push a tag like v1.2.0 to build a signed, minified APK and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Warn if unsigned by a release key
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: echo "::warning::No KEYSTORE_BASE64 secret set. The APK will be signed with the debug key, so it cannot update installs signed with your real key."

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare assets
        run: |
          NAME="KillVpn-${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "$NAME.apk"
          sha256sum "$NAME.apk" > "$NAME.apk.sha256"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}.apk
            ${{ env.ASSET }}.apk.sha256
          generate_release_notes: true
